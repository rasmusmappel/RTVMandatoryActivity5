syntax = "proto3";
option go_package = "RTVMandatoryActivity5/gRPC/proto";

message Amount {
    string id = 1;
    int32 bidAmount = 2;
}

// Outcome either "success", "fail" or "exception"
message Ack {
    string outcome = 1;
}

message Nothing {}

// The full auction state. Used both as the return of a Result request made by a client and as the replication message between nodes.
// seq == 0 means that no bid has been placed yet. 
// over is only filled in for Result requests.
message State {
    string highestBidId = 1;
    int32 highestBidAmount = 2;
    int64 endTimestamp = 3;
    int64 seq = 4;
    bool over = 5;
}

service AuctionHouse {
    rpc Bid(Amount) returns (Ack);
    rpc Result(Nothing) returns (State);
    rpc Replicate(State) returns (Ack); // Internal, only used between nodes for auction state replication
}