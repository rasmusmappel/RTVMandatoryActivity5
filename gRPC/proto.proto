syntax = "proto3";
option go_package = "RTVMandatoryActivity5/gRPC/proto";

message Amount {
    string id = 1;
    int32 bidAmount = 2;
}

message Acknowledgement {
    
}

message Nothing {

}

message Outcome {

}

service AuctionHouse {
    rpc Bid(Amount) returns (Acknowledgement);
    rpc Result(Nothing) returns (Outcome);
}